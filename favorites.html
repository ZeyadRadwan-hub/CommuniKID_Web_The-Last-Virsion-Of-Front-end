<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المفضلة | CommuniKID</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/settings-pages.css">
</head>
<body class="app-body settings-page">
    <div class="global-controls"><button id="themeToggle" class="control-btn">🌙</button><button id="langToggle" class="control-btn">EN</button></div>
    <header class="settings-header" style="margin-top: 40px; max-width: 800px; margin-left: auto; margin-right: auto;">
        <h1><span data-i18n="favorites_title">المفضلة ❤️</span><br><span style="font-size: 0.9rem; font-weight: normal; opacity: 0.7;" data-i18n="favorites_sub">أكثر كلمات وجمل يحبها البطل</span></h1>
        <a href="settings.html" class="control-btn" style="text-decoration: none;" data-i18n="back">⬅️ رجوع</a>
    </header>
    
    <div class="auth-container" style="margin: 0 auto; max-width: 800px;">
        <div id="favLiveCaptionBox" style="margin-bottom: 20px; padding: 15px; border-radius: 10px; display: none; text-align: center; font-size: 1.3rem; font-weight: bold; background: var(--bg-color); border: 2px dashed var(--border-color); color: var(--text-color); transition: 0.3s;"></div>

        <div class="auth-box" style="margin-bottom: 30px;">
            <h2 style="color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px dashed var(--border-color); padding-bottom: 10px;" data-i18n="fav_sentences">الجمل المفضلة 📝</h2>
            <div id="favSentencesList" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>

        <div class="auth-box">
            <h2 style="color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px dashed var(--border-color); padding-bottom: 10px;" data-i18n="fav_words">الكلمات المفضلة 🔤</h2>
            <div id="favWordsList" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>
    </div>
    <script src="js/global.js"></script>
    <script src="js/favorites.js"></script>
</body>
</html>
