<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإنجازات | CommuniKID</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/settings-pages.css">
</head>
<body class="app-body settings-page">
    <div class="global-controls"><button id="themeToggle" class="control-btn">🌙</button><button id="langToggle" class="control-btn">EN</button></div>
    <header class="settings-header" style="margin-top: 40px; max-width: 800px; margin-left: auto; margin-right: auto;">
        <h1><span data-i18n="achievements_title">إنجازات البطل 🏅</span><br><span style="font-size: 0.9rem; font-weight: normal; opacity: 0.7;" data-i18n="achievements_sub">الأوسمة التي حصدها بطلنا</span></h1>
        <a href="settings.html" class="control-btn" style="text-decoration: none;" data-i18n="back">⬅️ رجوع</a>
    </header>
    <div class="auth-container" style="margin: 0 auto; max-width: 800px;">
        <div class="auth-box">
            <h3 style="text-align:center; color:var(--primary-color);"><span data-i18n="total_points_achieve">إجمالي النقاط:</span> <span id="achievePoints">0</span> ⭐</h3>
            <div class="grid-layout" id="achievementsGrid"></div>
        </div>
    </div>
    <script src="js/global.js"></script><script src="js/achievements.js"></script>
</body>
</html>
