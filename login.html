<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | CommuniKID</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="global-controls">
        <button id="themeToggle" class="control-btn">🌙</button>
        <button id="langToggle" class="control-btn">EN</button>
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <div class="logo-container">
                <h1 data-i18n="welcome_title_login">كوميوني-كيد 🚀</h1>
                <p data-i18n="welcome_subtitle_login">مرحباً بعودتك يا بطل!</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email" data-i18n="email_label">البريد الإلكتروني</label>
                    <input type="email" id="email" data-i18n-placeholder="email_placeholder" placeholder="أدخل بريدك الإلكتروني" required>
                </div>
                <div class="input-group">
                    <label for="password" data-i18n="password_label">كلمة المرور</label>
                    <input type="password" id="password" data-i18n-placeholder="password_placeholder" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="primary-btn" data-i18n="login_btn">تسجيل الدخول السريع</button>
            </form>

            <div class="auth-footer">
                <p><span data-i18n="new_user">أول مرة هنا؟</span> <a href="signup.html" data-i18n="create_account_link">أنشئ حساباً جديداً</a></p>
            </div>
        </div>
    </div>
    <script src="js/global.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
