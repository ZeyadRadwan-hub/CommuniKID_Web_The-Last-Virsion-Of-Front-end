<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المهام | CommuniKID Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/therapist.css">
</head>
<body class="app-body">

    <div class="global-controls">
        <button id="themeToggle" class="control-btn">🌙</button>
        <button id="langToggle" class="control-btn">EN</button>
    </div>

    <nav class="therapist-navbar">
        <div style="color: #fff; font-size: 1.5rem; font-weight: bold;">CommuniKID <span style="color: #3498db;">Pro</span></div>
        <div class="nav-links">
            <a href="therapist-home.html" data-i18n="nav_home">الرئيسية</a>
            <a href="therapist-patients.html" data-i18n="nav_patients">مرضاي</a>
            <a href="therapist-tasks.html" class="active" data-i18n="nav_tasks">المهام</a>
            <a href="therapist-chat.html" data-i18n="nav_messages">الرسائل</a>
            <a href="therapist-appointments.html" data-i18n="nav_appointments">المواعيد</a>
            <a href="therapist-settings.html" data-i18n="settings">الإعدادات</a>
        </div>
        <button id="logoutBtn" class="danger-btn" data-i18n="logout">خروج 🚪</button>
    </nav>

    <main class="main-content" style="max-width: 900px;">
        <header style="margin-bottom: 30px;">
            <h1 data-i18n="therapist_tasks_title">إسناد مهام جديدة 📝</h1>
            <p data-i18n="therapist_tasks_sub">حدد التدريبات المطلوبة من الأبطال لتنفيذها في المنزل.</p>
        </header>

        <section class="task-creator" style="background: var(--card-bg); border-radius: 20px; padding: 30px; border: 1px solid var(--border-color); margin-bottom: 30px;">
            <form id="sendTaskForm">
                <div class="input-group">
                    <label data-i18n="choose_hero">اختار البطل</label>
                    <select id="targetPatient" required>
                        <option value="زياد رضوان">زياد رضوان</option>
                        <option value="سارة أحمد">سارة أحمد</option>
                        <option value="علي محمود">علي محمود</option>
                    </select>
                </div>
                <div class="input-group">
                    <label data-i18n="task_type_label">نوع المهمة</label>
                    <select id="taskType">
                        <option value="تدريب على تصنيف" data-i18n="task_full_cat">تدريب على تصنيف كامل</option>
                        <option value="تكوين جملة" data-i18n="task_sentence">تكوين جملة معينة</option>
                    </select>
                </div>
                <div class="input-group">
                    <label data-i18n="task_content_label">محتوى المهمة (التصنيف أو الجملة)</label>
                    <input type="text" id="taskContent" data-i18n-placeholder="task_content_placeholder" placeholder="مثال: تصنيف الحيوانات أو 'أنا أريد تفاحة'" required>
                </div>
                <button type="submit" class="primary-btn" data-i18n="send_task_btn">إرسال المهمة الآن 🚀</button>
            </form>
        </section>

        <section>
            <h2 style="margin-bottom: 20px; color: var(--text-color);" data-i18n="current_tasks_title">المهام الحالية 📋</h2>
            <div id="tasksContainer"></div>
        </section>
    </main>

    <script src="js/global.js"></script>
    <script src="js/therapist-tasks.js"></script>
</body>
</html>
