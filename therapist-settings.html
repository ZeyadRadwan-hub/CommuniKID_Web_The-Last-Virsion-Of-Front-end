<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الحساب | CommuniKID Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/therapist.css">
</head>
<body class="app-body">

    <div class="global-controls">
        <button id="themeToggle" class="control-btn">🌙</button>
        <button id="langToggle" class="control-btn">EN</button>
    </div>

    <nav class="therapist-navbar">
        <div style="color: #fff; font-size: 1.5rem; font-weight: bold;">CommuniKID <span style="color: #3498db;">Pro</span></div>
        <div class="nav-links">
            <a href="therapist-home.html" data-i18n="nav_home">الرئيسية</a>
            <a href="therapist-patients.html" data-i18n="nav_patients">مرضاي</a>
            <a href="therapist-tasks.html" data-i18n="nav_tasks">المهام</a>
            <a href="therapist-chat.html" data-i18n="nav_messages">الرسائل</a>
            <a href="therapist-appointments.html" data-i18n="nav_appointments">المواعيد</a>
            <a href="therapist-settings.html" class="active" data-i18n="settings">الإعدادات</a> 
        </div>
        <button id="logoutBtn" class="danger-btn" data-i18n="logout">خروج 🚪</button>
    </nav>

    <main class="main-content" style="max-width: 800px;">
        <header style="margin-bottom: 30px;">
            <h1 data-i18n="doc_settings_title">إعدادات الحساب الشخصي ⚙️</h1>
            <p data-i18n="doc_settings_sub">تحديث بياناتك المهنية وكلمة المرور</p>
        </header>

        <div class="auth-box" style="width: 100%; max-width: none; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
            <div class="input-group" style="background: var(--bg-color); padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 2px dashed #3498db;">
                <label style="color: #3498db; font-weight: bold; font-size: 1.1rem;" data-i18n="your_doc_code">🔑 كود الأخصائي الخاص بك</label>
                <p style="font-size: 0.85rem; color: #888; margin-bottom: 10px;" data-i18n="doc_code_help">أرسل هذا الكود لأولياء الأمور لربط حساباتهم بك.</p>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="docCodeDisplay" disabled style="opacity: 1; background: var(--card-bg); font-weight: bold; font-size: 1.2rem; text-align: center; color: var(--text-color); cursor: default;">
                    <button type="button" id="copyCodeBtn" class="action-btn" style="background: #3498db; color: white; width: 120px; font-weight: bold;" data-i18n="copy_code_btn">نسخ الكود</button>
                </div>
            </div>

            <form id="doctorSettingsForm">
                <div class="input-group">
                    <label data-i18n="prof_name_label">الاسم المهني</label>
                    <input type="text" id="docName" required>
                </div>
                <div class="input-group">
                    <label data-i18n="specialty_label_settings">التخصص</label>
                    <input type="text" id="docSpecialty" required>
                </div>
                <div class="input-group">
                    <label data-i18n="email_no_change">البريد الإلكتروني (لا يمكن تغييره)</label>
                    <input type="email" id="docEmail" disabled style="opacity: 0.6; cursor: not-allowed;">
                </div>
                <hr style="margin: 20px 0; border: 0; border-top: 1px dashed var(--border-color);">
                <div class="input-group">
                    <label data-i18n="new_pass_label">كلمة المرور الجديدة</label>
                    <input type="password" id="docPass">
                </div>
                <button type="submit" class="primary-btn" data-i18n="save_settings_btn">حفظ التغييرات ✅</button>
            </form>
        </div>
    </main>

    <script src="js/global.js"></script>
    <script src="js/therapist-settings.js"></script>
</body>
</html>
